spring.application.name=PlatePlan

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Hibernate logs the SQL error text, and for a duplicate login PostgreSQL puts the login in it.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

server.forward-headers-strategy=native
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

management.endpoints.web.exposure.include=health,info
management.endpoint.heapdump.access=none
management.endpoint.shutdown.access=none

# Ollama Cloud. The API key is OLLAMA_API_KEY from the environment, never this file.
spring.ai.ollama.base-url=https://ollama.com
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:gemma4:31b}
spring.ai.ollama.init.pull-model-strategy=never
spring.http.clients.imperative.read-timeout=120s
